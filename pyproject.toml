[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeagt"
version = "0.1.0"
description = "Kubernetes diagnostics: offline bundles, deterministic checks, and an LLM investigation loop that proposes fixes one at a time with human approval."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Yong", email = "yongthebuilder@gmail.com"}]
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.4"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kubeagt = "kubeagt.cli:main"

[project.urls]
Homepage = "https://github.com/tydev-new/kubeagt"

[tool.setuptools]
packages = ["kubeagt", "kubeagt.scenarios"]

[tool.setuptools.package-dir]
"" = "src"
"kubeagt.scenarios" = "scenarios"

[tool.setuptools.package-data]
kubeagt = ["py.typed"]
"kubeagt.scenarios" = ["*/*.yaml", "*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B008", "B023", "E501"]
