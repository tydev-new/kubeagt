apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      nodeSelector:
        disktype: ssd
      containers:
      - name: worker
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "echo started; sleep 36000"]
        resources:
          requests: {memory: 32Mi, cpu: 10m}
          limits: {memory: 64Mi}
