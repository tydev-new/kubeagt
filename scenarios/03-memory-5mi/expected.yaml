description: Redis with a 5Mi memory request and limit. On the kind test cluster idle Redis (about 3.4MB) actually starts under this cap, so kubeagt flags it as a no-headroom misconfiguration (warning) rather than an observed crash.
steps:
  - {apply: manifest.yaml}
settle_seconds: 30
expected_findings: [memory-too-small]
expected_fixes:
  - target: Deployment/redis
    checks:
      - {path: "spec.template.spec.containers[0].resources.requests.memory", equals: 128Mi}
      - {path: "spec.template.spec.containers[0].resources.limits.memory", equals: 512Mi}
expect_healthy: true
