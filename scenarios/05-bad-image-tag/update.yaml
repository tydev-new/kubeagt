apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
      - name: web
        image: busybox:1.36-typo-does-not-exist
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 36000"]
        resources:
          requests: {memory: 32Mi, cpu: 10m}
          limits: {memory: 64Mi}
