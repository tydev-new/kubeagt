apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        # A small but realistic app: it needs API_URL from the api-config ConfigMap. Without it, it
        # logs a fatal line and exits 1, the way most real services fail on missing config.
        command:
        - sh
        - -c
        - |
          if [ -z "$API_URL" ]; then echo "FATAL: API_URL not set (expected from ConfigMap api-config)" >&2; exit 1; fi
          echo "api: started, upstream $API_URL"
          exec sleep 36000
        envFrom:
        - configMapRef: {name: api-config}
        resources:
          requests: {memory: 32Mi, cpu: 10m}
          limits: {memory: 64Mi}
