apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
      - name: api
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "sleep 36000"]
        envFrom:
        - configMapRef: {name: api-config}
        resources:
          requests: {memory: 32Mi, cpu: 10m}
          limits: {memory: 64Mi}
